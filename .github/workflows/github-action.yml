
name: Generate Answers

on:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f tp1/Dockerfile -t rep-lab2 .

      - name: Run Docker container
        run: |
          docker run --rm   --user "$(id -u):$(id -g)"   -v "$(pwd):/out"   -e OUTPUT_DIR=/out/tp1   rep-lab2
      
      
      - name: Build LLM Docker image
        run: docker build -f tp2/llm/Dockerfile.llm -t rep-lab2-llm .

      - name: Run LLM Docker container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd):/out" \
            -e OUTPUT_DIR=/out/tp2/llm \
            rep-lab2-llm
      - name: Commit and push answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tp1/answer_associativity.txt tp1/answer_banking.txt \
          tp2/llm/answer_associativity_llm.txt tp2/llm/answer_banking_llm.txt

          if git diff --cached --quiet; then
            echo "No answer changes to commit."
            exit 0
          fi

          git commit -m "Update generated answers"
          git push
      
